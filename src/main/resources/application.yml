spring:
  application:
    name: coursegraph
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coursegraph}
    username: ${DB_USER:learning}
    password: ${DB_PASSWORD:learning_local_only}
  flyway:
    enabled: true
    url: ${DB_URL:jdbc:postgresql://localhost:5432/coursegraph}
    user: ${DB_USER:learning}
    password: ${DB_PASSWORD:learning_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  graphql:
    graphiql:
      enabled: false
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
# TODO: D4 configure JWT issuer/audience and endpoint policies in SecurityConfig where required.
