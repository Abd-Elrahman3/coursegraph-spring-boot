name: Learning checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      through:
        description: Run the cumulative learning gate through this milestone
        required: true
        type: choice
        options: [M1, M2, M3, D4, D5, D6, D7]
permissions:
  contents: read
jobs:
  starter-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B -ntp clean verify
  learning-gate:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select cumulative milestone
        id: milestone
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED: ${{ inputs.through }}
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          python3 - <<'PY'
          import os,re
          if os.environ['EVENT']=='workflow_dispatch':
              milestone=os.environ['REQUESTED']
          elif os.environ['SOURCE_BRANCH']=='feature/reflection':
              milestone='D7'
          else:
              m=re.fullmatch(r'feature/(m[123]|d[4567])-[a-z0-9-]+',os.environ['SOURCE_BRANCH'])
              if not m: raise SystemExit('Use a documented milestone branch (feature/m1-domain, etc.)')
              milestone=m.group(1).upper()
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('through='+milestone+'\n')
          PY
      - name: Test cumulative behavior and evidence
        env:
          THROUGH: ${{ steps.milestone.outputs.through }}
        run: python3 scripts/check_progress.py --through "$THROUGH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learning-test-reports
          path: target/surefire-reports/
