name: coursegraph-learning
services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_DB: coursegraph
      POSTGRES_USER: ${DB_USER:-learning}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-learning_local_only}
    ports: ["127.0.0.1:${DB_PORT:-5432}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.2-alpine
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    profiles: ["auth"]
    command: ["start-dev", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_local_only}
    ports: ["127.0.0.1:8088:8080"]
    volumes: ["keycloak_data:/opt/keycloak/data"]
volumes:
  postgres_data:
  keycloak_data:
